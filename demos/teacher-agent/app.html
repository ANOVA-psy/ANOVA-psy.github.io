<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评课演示 · 中学教师教学评估与改进智能体</title>
<meta name="description" content="可交互的评课演示：选一节示例课例，走一遍解析→评分→取证→建议四步，看结构化报告长什么样。预置示例输出，不调用真实模型。">
<style>
  :root{
    --paper:#FBFAF7; --paper-2:#F5F3EE; --card:#FFFFFF; --ink:#1B1A17; --ink-2:#43413B; --ink-3:#817D73;
    --line:#E5E1D8; --line-2:#EFEBE2; --moss:#24605A; --moss-tint:#EDF3F1; --moss-line:#CFE0DA;
    --amber:#8C5A1B; --amber-tint:#FBF2E4; --amber-line:#EEDFC4;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px;
    line-height:1.6; -webkit-font-smoothing:antialiased}
  .app{max-width:1080px; margin:0 auto; padding:18px 16px 30px}

  .bar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:14px}
  .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--moss)}
  .bar strong{font-size:14.5px}
  .badge{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
    background:var(--amber-tint); border:1px solid var(--amber-line); color:var(--amber);
    border-radius:4px; padding:2px 6px}
  .bar .who{margin-left:auto; font-size:11.5px; color:var(--ink-3)}

  .grid{display:grid; grid-template-columns:250px minmax(0,1fr); gap:14px; align-items:start}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px}
  .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); display:block; margin-bottom:9px}

  /* 列表 */
  .list{display:flex; flex-direction:column; gap:6px}
  .item{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:10px 11px; cursor:pointer; font-family:var(--sans); transition:.15s; width:100%}
  .item:hover{border-color:var(--moss-line); background:var(--moss-tint)}
  .item b{display:block; font-size:13px; font-weight:600; color:var(--ink); line-height:1.45}
  .item span{display:block; font-size:11px; color:var(--ink-3); margin-top:2px; font-family:var(--mono)}
  .item[aria-pressed="true"]{border-color:var(--moss); background:var(--moss-tint)}
  .item:focus-visible{outline:2px solid var(--moss); outline-offset:2px}
  .dims-hint{margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2);
    font-size:11.5px; color:var(--ink-3); line-height:1.75}
  .dims-hint b{color:var(--ink-2); font-weight:600}

  /* 主区 */
  .brief{background:var(--paper); border:1px solid var(--line-2); border-radius:8px;
    padding:12px 13px; font-size:12.5px; color:var(--ink-2); line-height:1.75; margin-bottom:14px}
  .brief b{color:var(--ink); font-weight:600}
  .brief .t{font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:4px}

  .run{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .btn{font-family:var(--sans); font-size:13.5px; border-radius:7px; padding:9px 16px; cursor:pointer;
    border:1px solid var(--moss); background:var(--moss); color:#fff; transition:background .15s;
    white-space:nowrap}
  .btn:hover{background:#1D4F4A}
  .btn.ghost{background:transparent; color:var(--moss)}
  .btn.ghost:hover{background:var(--moss-tint)}
  .btn:disabled{opacity:.45; cursor:default}
  .btn:focus-visible{outline:2px solid var(--moss); outline-offset:2px}

  .steps{display:flex; gap:6px; flex:1; flex-wrap:wrap; min-width:180px}
  .step{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); border:1px solid var(--line);
    background:var(--card); border-radius:999px; padding:3px 9px; transition:.2s}
  .step.on{border-color:var(--moss-line); background:var(--moss-tint); color:var(--moss)}
  .step.done{border-color:var(--moss); background:var(--moss); color:#fff}

  /* 报告 */
  .report{display:none}
  .report.on{display:block; animation:fade .35s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .report.on{animation:none} }

  .rep-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    border-bottom:1px solid var(--line-2); padding-bottom:10px; margin-bottom:14px; flex-wrap:wrap}
  .rep-head .h{font-size:14px; font-weight:600}
  .rep-head .s{font-family:var(--mono); font-size:11px; color:var(--ink-3)}

  .dim{border:1px solid var(--line); border-radius:8px; padding:11px 12px; margin-bottom:8px;
    cursor:pointer; transition:.15s; background:var(--card)}
  .dim:hover{border-color:var(--moss-line)}
  .dim[aria-expanded="true"]{border-color:var(--moss-line); background:var(--paper)}
  .dim:focus-visible{outline:2px solid var(--moss); outline-offset:2px}
  .dim-top{display:flex; align-items:center; gap:10px}
  .dim-name{font-size:13px; font-weight:600; flex:none; min-width:74px}
  .track{flex:1; height:5px; background:var(--line-2); border-radius:3px; overflow:hidden; min-width:60px}
  .track i{display:block; height:100%; background:var(--moss); border-radius:3px; width:0;
    transition:width .5s cubic-bezier(.3,.9,.4,1)}
  .dim-score{font-family:var(--mono); font-size:13px; color:var(--ink); flex:none; width:26px; text-align:right}
  .dim-ev{display:none; margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--ink-2); line-height:1.75}
  .dim[aria-expanded="true"] .dim-ev{display:block}
  .ts{font-family:var(--mono); font-size:10.5px; color:var(--moss); background:var(--moss-tint);
    border-radius:3px; padding:1px 5px; margin-right:5px; white-space:nowrap}

  .advice{margin-top:14px}
  .advice ol{margin:0; padding-left:18px; font-size:13px; color:var(--ink-2); line-height:1.85}
  .advice li{margin-bottom:6px}
  .advice li b{color:var(--ink); font-weight:600}

  .empty{text-align:center; padding:26px 10px; color:var(--ink-3); font-size:13px}
  .note{margin-top:14px; font-size:11.5px; line-height:1.75; color:var(--ink-3);
    border-top:1px solid var(--line-2); padding-top:12px}
  .note b{color:var(--ink-2); font-weight:600}

  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
    .app{padding:14px 12px 22px}
    .dim-name{min-width:64px; font-size:12.5px}
  }
  /* 嵌入首页卡片：压到一张卡片的高度，只留结论部分 */
  body.embed{overflow:hidden}
  body.embed .app{max-width:none; padding:10px 12px 6px}
  body.embed .note{display:none}
  body.embed .bar{margin-bottom:8px}
  body.embed .bar strong{font-size:13px}
  body.embed .bar .who{display:none}
  body.embed .grid{grid-template-columns:1fr; gap:0}
  body.embed .panel{padding:11px 12px 12px; border:0; border-radius:0; background:transparent}
  body.embed .list{flex-direction:row; overflow-x:auto; padding-bottom:2px; margin-bottom:9px}
  body.embed .item{width:auto; flex:none; white-space:nowrap; padding:5px 8px}
  body.embed .item span{display:none}
  body.embed .item b{font-size:11px}
  body.embed .dims-hint,body.embed .brief,body.embed .steps,body.embed .advice,body.embed .empty,body.embed .rep-head{display:none}
  body.embed .run{display:none}
  body.embed .dim{padding:5px 9px; margin-bottom:3px; cursor:default; border-radius:6px}
  body.embed .track{height:4px}
  body.embed .dim-name{font-size:11.5px; min-width:58px}
  body.embed .dim-score{font-size:11.5px}
  body.embed .dim-ev{display:none !important}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="dot" aria-hidden="true"></span>
    <strong>评课 · 教学评估与改进</strong>
    <span class="badge">交互演示</span>
    <span class="who">示例课例 · 预置输出</span>
  </div>

  <div class="grid">

    <div class="panel">
      <span class="lbl">示例课例</span>
      <div class="list" id="list" role="group" aria-label="选择课例"></div>
      <div class="dims-hint">
        <b>评价维度</b><br>
        目标清晰度 · 任务设计 · 师生互动 · 评价一致性。每项都要落到具体时间点的证据上，不给没有出处的分。
      </div>
    </div>

    <div class="panel">
      <div class="brief" id="brief">
        <div class="t" id="briefT">先选一节课例</div>
        <div id="briefB">左边三节课都是示例数据，用来演示这份报告长什么样。</div>
      </div>

      <div class="run">
        <button class="btn" type="button" id="runBtn" disabled>开始评估</button>
        <button class="btn ghost" type="button" id="resetBtn">清空</button>
        <div class="steps" id="steps">
          <span class="step" data-i="0">解析材料</span>
          <span class="step" data-i="1">维度评分</span>
          <span class="step" data-i="2">定位证据</span>
          <span class="step" data-i="3">生成建议</span>
        </div>
      </div>

      <div class="empty" id="empty">选择课例 → 开始评估，四步走完会出一份可展开的结构化报告。</div>

      <div class="report" id="report">
        <div class="rep-head">
          <span class="h" id="repT">评课报告</span>
          <span class="s" id="repS"></span>
        </div>
        <div id="dims"></div>
        <div class="advice">
          <span class="lbl">可以动手改的地方</span>
          <ol id="adviceList"></ol>
        </div>
      </div>
    </div>
  </div>

  <p class="note">
    <b>这是设计演示，不是真实系统。</b>界面结构与报告格式来自课题组原型；分数、证据与建议全部是预置的示例内容，
    点「开始评估」不会调用任何模型，也不会保存或上传任何东西。真实课例、学校与教师身份均不在此展示。
  </p>
</div>

<script>
(function () {
  "use strict";

  if (/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');

  var DATA = [
    {
      id: 'phys',
      title: '初二物理 ·《浮力》',
      meta: '40 分钟 · 转写 8,240 字',
      brief: '<b>材料：</b>教学设计（3 页）+ 课堂实录转写。教师先用铁块与铁船制造矛盾，再分组测排水体积，最后回到阿基米德原理。',
      dims: [
        { name: '目标清晰度', score: 82, ev: '00:02 开场就把问题立起来——「今天只解决一件事：为什么铁块沉、铁船浮」。这句话后面被回扣了三次。' },
        { name: '任务设计', score: 74, ev: '06:40 分组测三种物体的排水体积。任务单给了记录表格，但没写「体积怎么算」，两个组各用了一种口径。' },
        { name: '师生互动', score: 61, ev: '12:15 起共 9 次提问，其中 7 次是封闭式；提问后平均等待 1.2 秒就点名。' },
        { name: '评价一致性', score: 68, ev: '38:20 小结回到阿基米德原理，但课初「铁船浮」的问题没有回收，学生不知道自己那个解释算不算成立。' }
      ],
      advice: [
        '把课初的问题写在板书角落，小结时逐条划掉——学生能看见问题被回答了。',
        '任务单加一列「我们怎么算体积」，把口径写下来，组间差异就变成讨论材料，而不是要藏起来的误差。',
        '提问后停 3 秒再点名；把 2 个封闭式问题换成「如果换一种液体，会怎样」。'
      ]
    },
    {
      id: 'eng',
      title: '高一英语 ·《写作中的衔接》',
      meta: '40 分钟 · 转写 7,150 字',
      brief: '<b>材料：</b>教学设计 + 学案 + 课堂实录转写。教师讲三种衔接手段，学生改写段落并两两互评。',
      dims: [
        { name: '目标清晰度', score: 76, ev: '01:10 出示目标「用三种衔接手段让段落更连贯」，具体到可数，学生在学案上也抄了一遍。' },
        { name: '任务设计', score: 80, ev: '14:30 学生改写同一段并互评，要求标出用到的衔接词——有明确产出物，也有检查方式。' },
        { name: '师生互动', score: 70, ev: '22:05 起巡组 12 分钟，与 6 个组各说了半分钟，但第 4、5、8 组全程没被走到。' },
        { name: '评价一致性', score: 72, ev: '38:40 展示的教师范例只体现了两种手段，第三种给了规则没给例子。' }
      ],
      advice: [
        '巡组前先圈出这节课需要重点看的组，保证每组至少被问到一次。',
        '范例补上第三种手段，或者直接用学生作品当范例，比教师范文更有说服力。',
        '把「三种手段」做成可勾选的清单，互评时直接照单打勾，省掉解释成本。'
      ]
    },
    {
      id: 'chn',
      title: '初二语文 ·《紫藤萝瀑布》',
      meta: '45 分钟 · 转写 9,030 字',
      brief: '<b>材料：</b>教学设计 + 课堂实录转写。教师以朗读与讲解推进，目标是读出情感转折。',
      dims: [
        { name: '目标清晰度', score: 88, ev: '00:50 目标落在「读出作者从花到人的情感转折」，指向文本本身，不是泛泛的「体会美」。' },
        { name: '任务设计', score: 66, ev: '10:20 直接进入齐读与讲解，45 分钟里学生自己读文本的时间约 6 分钟。' },
        { name: '师生互动', score: 74, ev: '25:10 有学生问「为什么是瀑布不是河流」，教师答了一句就转回预设流程——这个问题其实是入口。' },
        { name: '评价一致性', score: 58, ev: '41:30 检测环节问的是「本文用了哪些修辞」，和「读出转折」这个目标不是一件事。' }
      ],
      advice: [
        '把独立阅读从 6 分钟扩到 12 分钟，先读后讲，讲解才有落点。',
        '学生那个「为什么是瀑布」值得单独留 5 分钟讨论，它就是情感转折的入口。',
        '检测问题换成「哪一句让你感觉到转折」，让评价回到目标上。'
      ]
    }
  ];

  var current = null, running = false;

  function el(id) { return document.getElementById(id); }

  function buildList() {
    var list = el('list');
    DATA.forEach(function (d, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item';
      b.setAttribute('aria-pressed', 'false');
      b.dataset.idx = i;
      b.innerHTML = '<b>' + d.title + '</b><span>' + d.meta + '</span>';
      list.appendChild(b);
    });
    list.addEventListener('click', function (e) {
      var b = e.target.closest('.item');
      if (!b || running) return;
      select(+b.dataset.idx);
    });
  }

  function select(i) {
    current = DATA[i];
    Array.prototype.forEach.call(document.querySelectorAll('.item'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.idx === String(i) ? 'true' : 'false');
    });
    el('briefT').textContent = current.title;
    el('briefB').innerHTML = current.brief;
    el('runBtn').disabled = false;
    el('report').classList.remove('on');
    el('empty').style.display = '';
    el('empty').textContent = '已选好课例。点「开始评估」，四步走完出报告。';
    resetSteps();
  }

  function resetSteps() {
    Array.prototype.forEach.call(document.querySelectorAll('.step'), function (s) {
      s.classList.remove('on', 'done');
    });
  }

  function run() {
    if (!current || running) return;
    running = true;
    el('runBtn').disabled = true;
    el('report').classList.remove('on');
    el('empty').style.display = '';
    resetSteps();

    var steps = document.querySelectorAll('.step');
    var msgs = ['切分材料，标注可定位片段…', '按四个维度逐项打分…', '把每个分数对回原文…', '整理成可以动手改的建议…'];

    var i = 0;
    function tick() {
      if (i > 0) {
        steps[i - 1].classList.remove('on');
        steps[i - 1].classList.add('done');
      }
      if (i >= steps.length) { finish(); return; }
      steps[i].classList.add('on');
      el('empty').textContent = msgs[i];
      i++;
      setTimeout(tick, 520);
    }
    tick();
  }

  function finish() {
    running = false;
    el('runBtn').disabled = false;
    el('empty').style.display = 'none';
    el('report').classList.add('on');
    el('repT').textContent = current.title + ' · 评课报告';
    el('repS').textContent = '4 个维度 · 示例输出';

    var host = el('dims');
    host.innerHTML = '';
    current.dims.forEach(function (d, i) {
      var box = document.createElement('div');
      box.className = 'dim';
      box.setAttribute('role', 'button');
      box.setAttribute('tabindex', '0');
      box.setAttribute('aria-expanded', 'false');
      box.innerHTML =
        '<div class="dim-top">' +
          '<span class="dim-name">' + d.name + '</span>' +
          '<span class="track"><i style="width:0"></i></span>' +
          '<span class="dim-score">' + d.score + '</span>' +
        '</div>' +
        '<div class="dim-ev"><span class="ts">证据</span>' + d.ev + '</div>';
      host.appendChild(box);

      setTimeout(function () {
        box.querySelector('.track i').style.width = d.score + '%';
      }, 60 + i * 90);

      function toggle() {
        var on = box.getAttribute('aria-expanded') === 'true';
        box.setAttribute('aria-expanded', on ? 'false' : 'true');
      }
      box.addEventListener('click', toggle);
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });

    var ol = el('adviceList');
    ol.innerHTML = '';
    current.advice.forEach(function (a) {
      var li = document.createElement('li');
      li.textContent = a;
      ol.appendChild(li);
    });
  }

  el('runBtn').addEventListener('click', run);
  el('resetBtn').addEventListener('click', function () {
    running = false;
    current = null;
    el('report').classList.remove('on');
    el('empty').style.display = '';
    el('empty').textContent = '选择课例 → 开始评估，四步走完会出一份可展开的结构化报告。';
    el('briefT').textContent = '先选一节课例';
    el('briefB').textContent = '左边三节课都是示例数据，用来演示这份报告长什么样。';
    el('runBtn').disabled = true;
    resetSteps();
    Array.prototype.forEach.call(document.querySelectorAll('.item'), function (b) {
      b.setAttribute('aria-pressed', 'false');
    });
  });

  buildList();
  select(0);

  // 嵌入卡片时直接出报告：卡片只是预览，分步动画在主演示页里看
  if (document.body.classList.contains('embed')) {
    finish();
  }
})();
</script>
</body>
</html>
