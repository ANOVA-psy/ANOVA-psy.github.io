<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面演示 · 视听语音整合训练系统</title>
<meta name="description" content="视听语音整合训练系统的真实界面：入口页、结果报告与历史记录，直接从项目源码渲染。未连接后端，仅作静态展示。">
<style>
  :root{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#1B1A17; --ink-2:#43413B; --ink-3:#817D73;
    --line:#E5E1D8; --line-2:#EFEBE2; --moss:#24605A; --moss-tint:#EDF3F1; --moss-line:#CFE0DA;
    --amber:#8C5A1B; --amber-tint:#FBF2E4; --amber-line:#EEDFC4;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6}

  .bar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--card)}
  .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--moss)}
  .bar strong{font-size:14px}
  .bar .tag{font-family:var(--mono); font-size:10px; letter-spacing:.05em; background:var(--amber-tint);
    border:1px solid var(--amber-line); color:var(--amber); border-radius:4px; padding:2px 6px}
  .bar .src{margin-left:auto; font-size:11.5px; color:var(--ink-3)}

  .tabs{display:flex; gap:4px; padding:9px 16px; border-bottom:1px solid var(--line-2);
    background:var(--card); flex-wrap:wrap}
  .tab{font-family:var(--sans); font-size:12.5px; color:var(--ink-2); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; transition:.15s}
  .tab:hover{border-color:var(--moss-line); background:var(--moss-tint)}
  .tab[aria-selected="true"]{border-color:var(--moss); background:var(--moss-tint); color:var(--moss); font-weight:600}
  .tab:focus-visible{outline:2px solid var(--moss); outline-offset:2px}

  .view{position:relative; background:#F1F5F9; overflow:hidden}
  .view iframe{display:block; width:100%; border:0; background:#F1F5F9}

  .note{padding:11px 16px; font-size:11.5px; line-height:1.7; color:var(--ink-3);
    border-top:1px solid var(--line-2); background:var(--card)}
  .note b{color:var(--ink-2); font-weight:600}

  /* 嵌入首页卡片：整页等比缩小到卡片里，不可点击 */
  body.embed .bar{padding:9px 12px}
  body.embed .bar .src{display:none}
  body.embed .tabs,body.embed .note{display:none}
  body.embed{overflow:hidden; background:#F1F5F9; display:flex; flex-direction:column; height:100vh}
  body.embed .view{flex:1; position:relative; overflow:hidden; cursor:default}
  body.embed .view iframe{
    width:1280px; height:900px; transform-origin:top left; pointer-events:none;
    position:absolute; top:0; left:0;
  }
</style>
</head>
<body>

<div class="bar">
  <span class="dot" aria-hidden="true"></span>
  <strong>视听语音整合训练系统</strong>
  <span class="tag">源码真实界面</span>
  <span class="src">未连接后端 · 静态展示</span>
</div>

<div class="tabs" role="tablist" aria-label="界面切换">
  <button class="tab" type="button" role="tab" data-v="entry" aria-selected="true">入口页</button>
  <button class="tab" type="button" role="tab" data-v="result" aria-selected="false">结果报告</button>
  <button class="tab" type="button" role="tab" data-v="history" aria-selected="false">历史记录</button>
</div>

<div class="view" id="view">
  <iframe id="frame" src="app/index.html" title="视听语音整合训练系统界面"></iframe>
</div>

<p class="note">
  <b>这是项目源码里的真实页面，不是重画的示意图。</b>
  为了能在 GitHub Pages 上静态托管，只做了三处改动：Tailwind 与 ECharts 从 CDN 换成本地文件；预加载与 <code>/api</code> 请求换成空实现；结果页与历史页塞了一条示例记录，否则它们只会显示"暂无数据"。
  没有启动 Node 后端，按钮点了不会有反应；音频与视频素材没有随站点分发，所以试次跑不起来。
</p>

<script>
(function () {
  "use strict";

  var PAGES = {
    entry: 'app/index.html',
    result: 'app/result.html?id=demo-sample-1',
    history: 'app/history.html'
  };
  var embed = /[?&]embed=1/.test(location.search);
  if (embed) document.body.classList.add('embed');

  var frame = document.getElementById('frame');
  var view = document.getElementById('view');

  // 同源，可以直接读内容高度，把 iframe 撑到整页高，避免内部再出现滚动条
  function fitHeight() {
    if (embed) return;
    try {
      var d = frame.contentDocument;
      if (!d || !d.body) return;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      if (h > 200) frame.style.height = Math.min(h + 8, 2600) + 'px';
    } catch (e) {}
  }

  var innerH = 900;

  function measure() {
    try {
      var d = frame.contentDocument;
      if (d && d.body) {
        var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
        if (h > 200) innerH = h;
      }
    } catch (e) {}
    frame.style.height = innerH + 'px';
  }

  function fitScale() {
    if (!embed) return;
    measure();
    var w = view.clientWidth || 500;
    var h = view.clientHeight || 312;
    // 整页等比缩到卡片里：宽高都不溢出，宁可留白也不裁掉内容
    var s = Math.min(w / 1280, h / innerH);
    frame.style.transform = 'scale(' + s.toFixed(4) + ')';
    frame.style.left = Math.round((w - 1280 * s) / 2) + 'px';
    frame.style.top = Math.round((h - innerH * s) / 2) + 'px';
  }

  // 内容高度会随后续脚本、图片、图表变化，多量几次再定
  function settle() {
    [0, 200, 600, 1200, 2200].forEach(function (t) {
      setTimeout(function () { fitHeight(); fitScale(); }, t);
    });
  }

  frame.addEventListener('load', settle);
  window.addEventListener('resize', function () { fitHeight(); fitScale(); });

  function show(name) {
    var src = PAGES[name] || PAGES.entry;
    frame.src = src;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.setAttribute('aria-selected', t.dataset.v === name ? 'true' : 'false');
    });
  }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (t) show(t.dataset.v);
  });

  var q = null;
  try { q = new URLSearchParams(location.search).get('view'); } catch (e) {}
  if (q && PAGES[q]) show(q);

  fitScale();
})();
</script>
</body>
</html>
